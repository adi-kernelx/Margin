name: CI

on:
  push:
    branches: ['**']
  pull_request:

jobs:
  frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: npm

      - run: npm ci

      - name: Typecheck
        run: npx tsc -b

      # The core/shell boundary is the one architectural rule worth failing a
      # build over: if src/core picks up a DOM, storage or framework import it
      # stops being testable in Node, and the split quietly stops being real.
      # Gated at zero; the rest of the codebase still has a lint backlog.
      - name: Core boundary
        run: npx eslint src/core --max-warnings 0

      - name: Test
        run: npm test

      - name: Build
        run: npx vite build

      # The static demo (VITE_DEMO=1) is built on every push so it cannot rot.
      # The check script fails if demo code leaks into the normal build or if
      # OCR / assistant code leaks into the demo.
      - name: Build demo
        run: npx vite build --mode demo

      - name: Check demo split
        run: node scripts/check-demo-build.mjs

      - name: Upload demo
        uses: actions/upload-artifact@v4
        with:
          name: margin-demo
          path: dist-demo
          retention-days: 14
