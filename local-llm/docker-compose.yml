

services:
  rag-api:
    build: ./rag-api
    container_name: rag-api
    ports:
      - "9101:9101"
    environment:
      - PORT=9101
      - QDRANT_URL=http://host.docker.internal:6333
      - QDRANT_API_KEY=my-secret-qdrant-key
      - LLM_BASE_URL=http://host.docker.internal:8081
      - LLM_MODEL=meta-llama-3.1-8b-instruct
      - MARGIN_ML_ROOT=/margin
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./rag-api:/app
      # ml/ holds the bundle code and its trained artifact (POST /bundle)
      - ../ml:/margin/ml:ro
