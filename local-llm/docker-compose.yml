

services:
  rag-api:
    build: ./rag-api
    container_name: rag-api
    ports:
      - "9101:9101"
    environment:
      - PORT=9101
      - QDRANT_URL=http://host.docker.internal:6333
      - QDRANT_API_KEY=my-secret-qdrant-key
      - LLM_BASE_URL=http://host.docker.internal:8081
    extra_hosts:
      - "host.docker.internal:host-gateway"
    volumes:
      - ./rag-api:/app
