apiVersion: apps/v1
kind: Deployment
metadata:
  name: ocr-orchestrator
spec:
  replicas: 1
  selector:
    matchLabels:
      app: ocr-orchestrator
  template:
    metadata:
      labels:
        app: ocr-orchestrator
    spec:
      containers:
      - name: orchestrator
        image: 515823085623.dkr.ecr.ap-south-1.amazonaws.com/ocr-orchestrator:v1
        ports:
        - containerPort: 8080
        env:
        - name: S3_BUCKET
          value: "pdf-reader-uploads-aditya"
        - name: OCR_URL
          value: "http://paddleocr-service:8000/ocr"
        - name: AWS_REGION
          value: "ap-south-1"
        resources:
          requests:
            memory: "256Mi"
            cpu: "100m"
          limits:
            memory: "512Mi"
            cpu: "500m"
---
apiVersion: v1
kind: Service
metadata:
  name: ocr-orchestrator
spec:
  type: NodePort
  selector:
    app: ocr-orchestrator
  ports:
    - protocol: TCP
      port: 8080
      targetPort: 8080
      nodePort: 30081
