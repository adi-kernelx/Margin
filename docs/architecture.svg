<svg xmlns="http://www.w3.org/2000/svg" width="1080" height="640" viewBox="0 0 1080 640" font-family="Helvetica, Arial, sans-serif">
  <title>Margin architecture</title>
  <defs>
    <marker id="head" markerUnits="userSpaceOnUse" markerWidth="10" markerHeight="8" refX="10" refY="4" orient="auto">
      <path d="M0,0 L10,4 L0,8 Z" fill="#333333"/>
    </marker>
  </defs>

  <rect width="1080" height="640" fill="#ffffff"/>

  <text x="24" y="38" font-size="17" font-weight="bold" fill="#222222">Margin — architecture</text>
  <text x="1056" y="38" font-size="12" fill="#777777" text-anchor="end">all components run on localhost</text>

  <!-- ================= Browser ================= -->
  <rect x="24" y="60" width="290" height="536" rx="6" fill="#fafafa" stroke="#999999"/>
  <text x="40" y="84" font-size="13" font-weight="bold" fill="#333333">Browser (React + Vite)</text>

  <rect x="48" y="100" width="242" height="170" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="64" y="126" font-size="13" font-weight="bold" fill="#222222">Reader</text>
  <text x="64" y="150" font-size="12" fill="#333333">PDF.js pages and text layer</text>
  <text x="64" y="170" font-size="12" fill="#333333">ink and annotations</text>
  <text x="64" y="190" font-size="12" fill="#333333">OCR text layer</text>
  <text x="64" y="210" font-size="12" fill="#333333">find in document</text>

  <rect x="48" y="292" width="242" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="64" y="313" font-size="13" font-weight="bold" fill="#222222">Assistant panel</text>
  <text x="64" y="330" font-size="11" fill="#555555">questions and cited answers</text>

  <rect x="48" y="356" width="242" height="48" rx="6" fill="#dae8fc" stroke="#6c8ebf"/>
  <text x="64" y="377" font-size="13" font-weight="bold" fill="#222222">Knowledge panel</text>
  <text x="64" y="394" font-size="11" fill="#555555">OKF concepts and verification</text>

  <!-- IndexedDB -->
  <path d="M74,452 V548 A100,12 0 0 0 274,548 V452" fill="#f5f5f5" stroke="#666666"/>
  <ellipse cx="174" cy="452" rx="100" ry="12" fill="#f5f5f5" stroke="#666666"/>
  <text x="174" y="490" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">IndexedDB</text>
  <text x="174" y="510" font-size="11" fill="#555555" text-anchor="middle">library, annotations, OCR cache</text>
  <text x="174" y="526" font-size="11" fill="#555555" text-anchor="middle">bundles, conversations</text>

  <!-- persistence bus -->
  <path d="M48,185 H36 V506" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M48,316 H36" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M48,380 H36" fill="none" stroke="#333333" stroke-width="1.3"/>
  <path d="M36,506 H74" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>

  <!-- ================= Local services ================= -->
  <rect x="372" y="60" width="440" height="536" rx="6" fill="#fafafa" stroke="#999999"/>
  <text x="388" y="84" font-size="13" font-weight="bold" fill="#333333">Local services</text>

  <rect x="396" y="105" width="180" height="56" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="412" y="128" font-size="13" font-weight="bold" fill="#222222">OCR service</text>
  <text x="412" y="147" font-size="11" fill="#555555">PaddleOCR · port 8000</text>

  <rect x="608" y="105" width="180" height="56" rx="6" fill="#e1d5e7" stroke="#9673a6"/>
  <text x="624" y="128" font-size="13" font-weight="bold" fill="#222222">Ollama</text>
  <text x="624" y="147" font-size="11" fill="#555555">qwen2.5:3b · port 11434</text>

  <!-- RAG API -->
  <rect x="396" y="190" width="392" height="240" rx="6" fill="#fff2cc" stroke="#d6b656"/>
  <text x="412" y="214" font-size="13" font-weight="bold" fill="#222222">RAG API</text>
  <text x="472" y="214" font-size="11" fill="#555555">FastAPI + LangGraph · port 9101</text>

  <rect x="411" y="232" width="150" height="40" rx="4" fill="#ffffff" stroke="#d6b656"/>
  <text x="423" y="249" font-size="12" font-weight="bold" fill="#222222">ingest</text>
  <text x="423" y="264" font-size="11" fill="#555555">chunk and embed</text>

  <rect x="411" y="296" width="105" height="40" rx="4" fill="#ffffff" stroke="#d6b656"/>
  <text x="423" y="313" font-size="12" font-weight="bold" fill="#222222">retrieve</text>
  <text x="423" y="328" font-size="11" fill="#555555">BM25 + vectors</text>

  <rect x="541" y="296" width="105" height="40" rx="4" fill="#ffffff" stroke="#d6b656"/>
  <text x="553" y="313" font-size="12" font-weight="bold" fill="#222222">rerank</text>
  <text x="553" y="328" font-size="11" fill="#555555">cross-encoder</text>

  <rect x="671" y="296" width="105" height="40" rx="4" fill="#ffffff" stroke="#d6b656"/>
  <text x="683" y="313" font-size="12" font-weight="bold" fill="#222222">generate</text>
  <text x="683" y="328" font-size="11" fill="#555555">prompt + citations</text>

  <rect x="411" y="360" width="180" height="40" rx="4" fill="#ffffff" stroke="#d6b656"/>
  <text x="423" y="377" font-size="12" font-weight="bold" fill="#222222">OKF bundles</text>
  <text x="423" y="392" font-size="11" fill="#555555">build and index concepts</text>

  <path d="M516,316 H541" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <path d="M646,316 H671" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>

  <!-- Qdrant -->
  <path d="M430,468 V548 A100,12 0 0 0 630,548 V468" fill="#f5f5f5" stroke="#666666"/>
  <ellipse cx="530" cy="468" rx="100" ry="12" fill="#f5f5f5" stroke="#666666"/>
  <text x="530" y="504" font-size="13" font-weight="bold" fill="#222222" text-anchor="middle">Qdrant (embedded)</text>
  <text x="530" y="522" font-size="11" fill="#555555" text-anchor="middle">pdf_chunks, okf_concepts</text>
  <text x="530" y="538" font-size="10.5" fill="#777777" text-anchor="middle">local-llm/data/qdrant</text>

  <path d="M530,430 V456" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="538" y="447" font-size="11" fill="#555555">store and search</text>

  <!-- generate -> Ollama -->
  <path d="M723,296 V161" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="729" y="180" font-size="11" fill="#555555">chat API</text>

  <!-- ================= Browser -> services ================= -->
  <path d="M290,126 H396" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <path d="M396,141 H290" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="343" y="119" font-size="11" fill="#555555" text-anchor="middle">image</text>
  <text x="343" y="156" font-size="11" fill="#555555" text-anchor="middle">text</text>

  <path d="M290,252 H411" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="343" y="245" font-size="11" fill="#555555" text-anchor="middle">/ingest</text>

  <path d="M290,316 H411" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="343" y="309" font-size="11" fill="#555555" text-anchor="middle">/query</text>

  <path d="M290,380 H411" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="343" y="373" font-size="11" fill="#555555" text-anchor="middle">/bundle</text>
  <text x="343" y="394" font-size="11" fill="#555555" text-anchor="middle">/concepts</text>

  <!-- ================= Offline ================= -->
  <rect x="836" y="60" width="220" height="536" rx="6" fill="#fafafa" stroke="#999999"/>
  <text x="852" y="84" font-size="13" font-weight="bold" fill="#333333">Offline (ml/)</text>

  <rect x="856" y="105" width="180" height="150" rx="6" fill="#d5e8d4" stroke="#82b366"/>
  <text x="872" y="128" font-size="13" font-weight="bold" fill="#222222">ML pipeline</text>
  <text x="872" y="152" font-size="12" fill="#333333">block extraction</text>
  <text x="872" y="172" font-size="12" fill="#333333">classifier training</text>
  <text x="872" y="192" font-size="12" fill="#333333">OKF bundle writer</text>
  <text x="872" y="212" font-size="12" fill="#333333">LambdaRank ranker</text>
  <text x="872" y="232" font-size="12" fill="#333333">evaluation and results</text>

  <path d="M946,255 V370" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="954" y="316" font-size="11" fill="#555555">train</text>

  <!-- artifacts (document shape) -->
  <path d="M876,370 H1004 L1016,382 V440 H876 Z" fill="#d5e8d4" stroke="#82b366"/>
  <path d="M1004,370 V382 H1016" fill="none" stroke="#82b366"/>
  <text x="888" y="393" font-size="12" font-weight="bold" fill="#222222">model artifacts</text>
  <text x="888" y="412" font-size="10.5" fill="#555555">okf_pipeline.joblib</text>
  <text x="888" y="428" font-size="10.5" fill="#555555">ranker.joblib</text>

  <path d="M876,405 H788" fill="none" stroke="#333333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#head)"/>
  <text x="832" y="398" font-size="11" fill="#555555" text-anchor="middle">loaded</text>

  <!-- legend -->
  <path d="M24,618 H60" fill="none" stroke="#333333" stroke-width="1.3" marker-end="url(#head)"/>
  <text x="68" y="622" font-size="11" fill="#555555">request / data flow</text>
  <path d="M190,618 H226" fill="none" stroke="#333333" stroke-width="1.3" stroke-dasharray="5,4" marker-end="url(#head)"/>
  <text x="234" y="622" font-size="11" fill="#555555">loaded at start-up</text>
</svg>
